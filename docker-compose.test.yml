version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teampulse_test
      POSTGRES_PASSWORD: teampulse_test
      POSTGRES_DB: teampulse_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampulse_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://teampulse_test:teampulse_test@postgres:5432/teampulse_test
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: test-secret-key-for-testing-only
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: '["http://localhost:3000"]'
      ENVIRONMENT: test
      GROQ_API_KEY: test-key
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      GROQ_API_KEY: test-key
      ENVIRONMENT: test
    ports:
      - "8002:8000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: test-secret
    ports:
      - "3001:3000"
    depends_on:
      - backend