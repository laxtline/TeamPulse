[project]
name = "teampulse-backend"
version = "1.0.0"
description = "TeamPulse Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "SIM", "T20", "ANN", "ARG", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "RET", "SLF", "TCH", "TID", "FA", "ISC"]
lint.ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ARG001", "ARG002", "TRY003", "PTH118", "S101", "S106", "S311", "B008"]
fixable = ["F", "I", "UP", "B", "C4", "PTH", "SIM", "T20", "ANN", "ARG", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "RET", "SLF", "TCH", "TID", "FA", "ISC"]
format.quote-style = "double"
format.indent-style = "space"
format.skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S311"]
"alembic/*" = ["S101", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
exclude = ["alembic", "venv", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"