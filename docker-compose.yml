version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teampulse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teampulse}
      POSTGRES_USER: ${POSTGRES_USER:-teampulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teampulse_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teampulse} -d ${POSTGRES_DB:-teampulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teampulse-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teampulse-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-teampulse}:${POSTGRES_PASSWORD:-teampulse_dev}@postgres:5432/${POSTGRES_DB:-teampulse}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-32-char-random-secret-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FRONTEND_URL: http://localhost:3000
      AI_SERVICE_URL: http://ai-service:8000
      ENVIRONMENT: development
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teampulse-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-32-char-random-secret-change-in-production}
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: teampulse-ai
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: llama-3.3-70b-versatile
      PORT: 8000
    ports:
      - "${AI_SERVICE_PORT:-8001}:8000"
    volumes:
      - ./ai-service:/app
      - /app/__pycache__

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: teampulse-network